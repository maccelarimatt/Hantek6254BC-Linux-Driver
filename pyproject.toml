[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hantek6254bc-linux"
version = "0.1.0"
description = "Userspace Linux driver and capture tools for the Hantek 6004BC/6254BC USB oscilloscope"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["pyusb>=1.2.1", "numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7", "PyQt6>=6.6"]
test = ["pytest>=8"]

[project.scripts]
hantek6254bc = "hantek6254bc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
